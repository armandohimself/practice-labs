name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Java tests
      run: ./gradlew :java-practice:test

    - name: Upload Java test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: java-test-reports
        path: java-practice/build/reports/tests/test/

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: js-practice/package-lock.json

    - name: Install dependencies
      working-directory: js-practice
      run: npm ci

    - name: Run JavaScript tests
      working-directory: js-practice
      run: npm test

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: js-coverage
        path: js-practice/coverage/

  sql-tests:
    name: SQL Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SQLite
      run: sudo apt-get update && sudo apt-get install -y sqlite3

    - name: Grant execute permission for test script
      run: chmod +x scripts/run-sql-tests.sh

    - name: Run SQL tests
      run: ./scripts/run-sql-tests.sh

  all-tests-complete:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [java-tests, javascript-tests, sql-tests]

    steps:
    - name: Success
      run: |
        echo "✅ All tests passed successfully!"
        echo "Java, JavaScript, and SQL tests completed."
